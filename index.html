<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,maximum-scale=1">
<meta name="theme-color" content="#0a0919">
<meta name="description" content="Arus — keuangan pribadi, local-first.">
<title>Arus</title>
<link rel="manifest" href="/manifest.webmanifest">
<link rel="icon" type="image/svg+xml" href="/favicon.svg">
<link rel="icon" type="image/png" sizes="192x192" href="/icons/icon-192.png">
<link rel="apple-touch-icon" href="/icons/icon-192.png">
</head>
<body>
<div id="app">
  <header id="hdr">
    <div class="brand">
      <span class="mark" data-ic="brand" aria-hidden="true"></span>
      <span class="wordmark">Arus</span>
    </div>
    <span class="spacer"></span>
  </header>
  <main id="main" role="main"></main>
  <nav id="nav" role="navigation" aria-label="Navigasi utama">
    <button id="nav-dasbor"    data-tab="dasbor"><span data-ic="dasbor"></span><span>Dasbor</span></button>
    <button id="nav-transaksi" data-tab="transaksi"><span data-ic="transaksi"></span><span>Transaksi</span></button>
    <button id="nav-add" aria-label="Tambah transaksi"><span class="fab">+</span><span>Tambah</span></button>
    <button id="nav-akun"      data-tab="akun"><span data-ic="akun"></span><span>Akun</span></button>
    <button id="nav-trading"   data-tab="trading"><span data-ic="trading"></span><span>Jurnal trading</span></button>
    <button id="nav-lainnya"   data-tab="lainnya"><span data-ic="lainnya"></span><span>Lainnya</span></button>
    <div class="keys" aria-hidden="true"><span><kbd>N</kbd> tambah transaksi</span><span><kbd>1</kbd>–<kbd>5</kbd> pindah halaman</span></div>
  </nav>
</div>
<div id="scrim" hidden></div>
<div id="sheet" role="dialog" aria-modal="true" aria-labelledby="sh-title" hidden></div>
<div id="toasts" aria-live="polite"></div>
<script type="module" src="/src/main.js"></script>
</body>
</html>
